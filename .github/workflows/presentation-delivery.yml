name: Focused delivery reliability

on: [push, pull_request]

permissions:
  contents: read

jobs:
  delivery-policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing Linux isolation prerequisite
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python -m pip install -r requirements.txt
      - name: Check Python sources
        run: python -m compileall -q scripts
      - name: Verify Linux worker boundaries and restricted Hermes compatibility
        run: python -m pytest tests/test_worker_boundary.py tests/test_hermes_tui.py tests/test_worker_readiness.py -q
      - name: Verify focused AI quality lifecycle and objective contracts
        run: python tests/offline_reliability_gate.py --timeout 1200 --report /tmp/clinical-focused-report.json

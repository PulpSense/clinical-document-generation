name: Focused delivery reliability

on: [push, pull_request]

permissions:
  contents: read

jobs:
  delivery-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check Python sources
        run: python -m compileall -q scripts
      - name: Verify delivery and recovery contracts
        run: >-
          python -m pytest -q
          tests/test_presentation_delivery.py
          tests/test_construction_reliability.py
          tests/test_editorial_publication.py
          tests/test_reviewer_transport.py
          tests/test_offline_reliability_gate.py
          tests/test_source_routing.py

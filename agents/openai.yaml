interface:
  display_name: "Clinical Document Generation"
  short_description: "Review and generate study documents"
  default_prompt: "Use $clinical-document-generation only when a client asks to generate prospective, ambispective, or retrospective study documents, including protocol, ICF, short summary, or ClinicalTrials.gov/PRS XML outputs. Create the editable Markdown source-of-truth input map first, block on missing required inputs before creating it, parse reviewer edits back into the internal reference, then generate the correct branch-specific outputs after approval."
